<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>选股助手</title>
    <link rel="stylesheet" href="./styles.css?v=20260521-3" />
  </head>
  <body>
    <main class="shell">
      <section class="topbar" aria-label="选股助手">
        <div>
          <p class="eyebrow">A-Share Picker</p>
          <h1>选股助手</h1>
        </div>
        <div class="meta">
          <span id="clockText">--</span>
          <span id="updateStatus">数据已准备</span>
          <button id="refreshButton" class="icon-button" type="button" title="刷新行情">
            <span aria-hidden="true">↻</span>
            <span class="sr-only">刷新行情</span>
          </button>
        </div>
      </section>

      <section class="workflow-section" aria-labelledby="buySectionTitle">
        <div class="section-head">
          <div>
            <h2 id="buySectionTitle">今日选股推荐</h2>
          </div>
          <a class="source-link" href="https://myteamw.github.io/tracker/" target="_blank" rel="noopener noreferrer">
            大池子
          </a>
        </div>

        <section class="assistant-panel" aria-label="今日选股推荐">
          <div class="assistant-head">
            <div>
              <h3>AI 分析输入</h3>
            </div>
            <div class="assistant-actions">
              <button id="refreshDefaultPromptButton" class="secondary" type="button">刷新默认提示词</button>
            </div>
          </div>
          <div class="prompt-stack">
            <label class="prompt-box">
              <span>我的要求（可输入）</span>
              <textarea id="userRequirementsInput" rows="5" placeholder="例如：只做短线、不要追高；持仓股优先控制回撤。"></textarea>
            </label>
          </div>
          <section class="pool-card" aria-label="股池列表">
            <div class="pool-head">
              <span>股池列表（https://myteamw.github.io/tracker/）</span>
              <span id="bigPoolCount">-- 只</span>
            </div>
            <div class="concept-filter" aria-label="概念筛选">
              <div class="concept-filter-head">
                <span>概念筛选</span>
                <div class="concept-filter-actions">
                  <button id="refreshConceptsButton" class="link-button" type="button">刷新概念</button>
                  <button id="clearConceptFilterButton" class="link-button" type="button">清空</button>
                </div>
              </div>
              <div id="conceptChips" class="concept-chips"></div>
              <div id="conceptFilterSummary" class="concept-filter-summary">未锁定概念，显示全部股池。</div>
            </div>
            <div id="bigPoolList" class="pool-list">正在读取大池子...</div>
          </section>
          <label class="result-box">
            <span>今日选股推荐</span>
            <div id="buyPickResult" class="pick-result">
              暂无 Codex 自动化选股结果。定时对话写入结果后这里会自动显示。
            </div>
          </label>
        </section>
      </section>

      <section class="workflow-section" aria-labelledby="holdingSectionTitle">
        <div class="section-head">
          <div>
            <h2 id="holdingSectionTitle">持仓操作建议</h2>
          </div>
          <span class="section-count" id="holdingCount">持仓 -- 只</span>
        </div>

        <section class="controls" aria-label="持仓股票和选股设置">
          <form id="stockForm" class="stock-form">
            <label class="stock-query">
              <span>股票代码/或股票名称</span>
              <input id="stockQueryInput" name="stockQuery" autocomplete="off" placeholder="002716 或 湖南白银" />
            </label>
            <label>
              <span>买入量（手）</span>
              <input id="buyLotsInput" name="buyLots" type="number" min="1" step="1" placeholder="1" />
            </label>
            <label>
              <span>买入价</span>
              <input id="buyPriceInput" name="buyPrice" type="number" min="0" step="0.01" placeholder="63.00" />
            </label>
            <button id="saveStockButton" class="primary" type="submit">添加股票</button>
            <button id="clearFormButton" class="secondary" type="button">清空</button>
          </form>

          <div class="setting-summary" id="settingSummary"></div>
        </section>

        <section class="table-wrap" aria-label="持仓股票列表">
          <table>
            <thead>
              <tr>
                <th>股票</th>
                <th>现价</th>
                <th>涨跌幅</th>
                <th>今高 / 今低</th>
                <th>底仓明细</th>
                <th>更新时间</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="stockRows"></tbody>
          </table>
          <div id="emptyState" class="empty" hidden>暂无持仓股票</div>
        </section>

        <label class="result-box result-card">
          <span>持仓操作建议</span>
          <div id="holdingAdviceResult" class="pick-result advice-result">
            暂无持仓操作建议。填写底仓明细后，下一次自动化会生成对应建议。
          </div>
        </label>
      </section>
    </main>

    <template id="rowTemplate">
      <tr>
        <td data-key="identity"></td>
        <td data-key="price"></td>
        <td data-key="change"></td>
        <td data-key="range"></td>
        <td data-key="basePosition"></td>
        <td data-key="updatedAt"></td>
        <td>
          <button class="delete" type="button">删除</button>
        </td>
      </tr>
    </template>

    <script src="./app.js?v=20260521-3"></script>
  </body>
</html>
